[package]
name = "beam-rs"
version = "0.0.31"
edition = "2024"

[lib]
name = "beam_rs"
path = "src/lib.rs"

[[bin]]
name = "beam-rs"
path = "src/main.rs"

[dependencies]
# Core
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rand = "0.8"
futures = "0.3"
log = "0.4"
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Cryptography
aes-gcm = "0.10"
argon2 = "0.5"
spake2 = "0.4"

# Hashing
xxhash-rust = { version = "0.8", features = ["xxh64"] }

# Interactive line prompts
rustyline = "18"

# iroh transport
iroh = "1.2.0"
iroh-mdns-address-lookup = "0.5.0"
swarm-discovery = "0.6.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
